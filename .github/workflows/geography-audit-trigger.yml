name: Geography iNaturalist cleanup trigger

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: github.event.issue.title == '[tiko-geography-inat-pass-20260824]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace remaining legacy animal markers with observation data
        shell: bash
        run: |
          git checkout feat/tiko-globe-app
          python3 <<'PY'
          import concurrent.futures
          import json
          import statistics
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          TODAY = '2026-08-24'
          ANIMALS_PATH = Path('packages/geography/content/country-animals.json')
          GENERATED_PATH = Path('packages/geography/generated/countries.json')

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def save(path, data):
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def req_json(url, timeout=18, retries=3):
              for attempt in range(retries + 1):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'TikoGlobeGeographyINatPass/1.0 (github.com/tikotalks/tiko-universe)'})
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception:
                      if attempt == retries:
                          return None
                      time.sleep(0.4 * (attempt + 1))
              return None

          animals = load(ANIMALS_PATH)
          generated = load(GENERATED_PATH)
          countries = generated.get('countries', generated if isinstance(generated, list) else [])
          meta = {c['id']: c for c in countries if isinstance(c, dict) and c.get('id')}

          def median_observation(points):
              if not points:
                  return None
              medlat = statistics.median(p[0] for p in points)
              medlon = statistics.median(p[1] for p in points)
              return min(points, key=lambda p:(p[0]-medlat)**2+(p[1]-medlon)**2)

          def inat_point(cc, animal):
              c = meta.get(cc, {})
              bbox = c.get('bbox')
              if not bbox or len(bbox) != 4:
                  return None
              west, south, east, north = [float(x) for x in bbox]
              if west > east:
                  return None
              names = []
              if animal.get('scientificName'):
                  names.append(animal['scientificName'])
              en = animal.get('names', {}).get('en')
              if en and en not in names:
                  names.append(en)
              for name in names:
                  params = urllib.parse.urlencode({
                      'taxon_name': name,
                      'nelat': north,
                      'nelng': east,
                      'swlat': south,
                      'swlng': west,
                      'quality_grade': 'research',
                      'geo': 'true',
                      'captive': 'false',
                      'per_page': 100,
                      'order_by': 'observed_on',
                      'order': 'desc',
                  })
                  result = req_json('https://api.inaturalist.org/v1/observations?' + params)
                  if not isinstance(result, dict):
                      continue
                  pts = []
                  for row in result.get('results', []):
                      coords = (row.get('geojson') or {}).get('coordinates')
                      if not coords or len(coords) < 2:
                          continue
                      try:
                          lon, lat = float(coords[0]), float(coords[1])
                      except (TypeError, ValueError):
                          continue
                      if not (south <= lat <= north and west <= lon <= east):
                          continue
                      pts.append((lat, lon, row.get('id')))
                  chosen = median_observation(pts)
                  if chosen:
                      return {
                          'lat': round(chosen[0],3),
                          'lon': round(chosen[1],3),
                          'locationSource': {'source':'inaturalist','observationId':chosen[2]}
                      }
              return None

          targets = []
          for cc, country in animals.get('countries', {}).items():
              for idx, animal in enumerate(country.get('animals', [])):
                  if animal.get('locationSource', {}).get('source') == 'legacy-authored-needs-review':
                      targets.append((cc, idx, animal))

          def resolve(t):
              cc, idx, animal = t
              return cc, idx, inat_point(cc, animal)

          resolved = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              for cc, idx, point in pool.map(resolve, targets):
                  if point:
                      resolved[(cc,idx)] = point

          changed = 0
          for cc, country in animals.get('countries', {}).items():
              for idx, animal in enumerate(country.get('animals', [])):
                  point = resolved.get((cc,idx))
                  if not point:
                      continue
                  animal['lat'] = point['lat']
                  animal['lon'] = point['lon']
                  animal['locationSource'] = point['locationSource']
                  changed += 1
              if country.get('animals'):
                  all_good = all(a.get('locationSource', {}).get('source') in {'gbif','curated-locality','inaturalist'} for a in country['animals'])
                  country['review'] = {'state':'reviewed' if all_good else 'draft','by':'openai-geography-inat-pass','at':TODAY}

          remaining = sum(
              1 for c in animals.get('countries', {}).values() for a in c.get('animals', [])
              if a.get('locationSource', {}).get('source') == 'legacy-authored-needs-review'
          )
          audit = animals.setdefault('locationAudit', {})
          audit['inaturalistImprovedOccurrences'] = changed
          audit['legacyLocationsRemaining'] = remaining
          audit['at'] = TODAY

          for cc, country in animals.get('countries', {}).items():
              assert country.get('animals'), f'{cc} has no animals'
              for a in country['animals']:
                  assert 'lat' in a and 'lon' in a
                  assert -90 <= a['lat'] <= 90 and -180 <= a['lon'] <= 180
                  assert 1 <= a.get('importance',0) <= 10

          save(ANIMALS_PATH, animals)
          print(f'iNaturalist replaced {changed} legacy markers; {remaining} legacy markers remain')
          PY

          git diff --exit-code -- packages/geography/generated packages/geography/content/animals.json packages/geography/content/landmarks.json
          git config user.name "Tiko Geography Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -- packages/geography/content/country-animals.json
          if git diff --cached --quiet; then
            echo "No geography changes required"
          else
            git commit -m "data(geography): replace legacy markers with observations"
            git push origin HEAD:feat/tiko-globe-app
          fi

      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "iNaturalist geography pass finished."
