name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scaffold check
        run: npm run scaffold:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Generated colour files (web/data/iOS) must stay in sync with their
      # single source (packages/ui/tiko-colors.json). Regenerate and fail if
      # anything changed — catches a colour edit that skipped `generate:colors`.
      - name: Colour generation drift
        run: |
          npm run generate:colors
          git diff --exit-code

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  admin-e2e:
    name: Admin Cypress E2E
    # Pinned: `ubuntu-latest` moved to 26.04, which the browsers these tests
    # drive do not support yet (Playwright refuses to install Chromium there).
    # Move back to `ubuntu-latest` together with the Playwright/Cypress upgrade.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Built and started here rather than through the action's `start` and
      # `wait-on`: on Node 22.23.5 the action's wait gives up on the first
      # refused connection ("Socket closed before the connection was
      # established") instead of retrying until the server is up.
      - name: Build admin
        working-directory: apps/admin/web
        run: npm run build

      - name: Start admin preview
        working-directory: apps/admin/web
        run: |
          npm run preview > preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3062; then
              echo "admin preview is up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "admin preview did not start within 60s"
          cat preview.log
          exit 1

      - name: Run admin Cypress tests
        uses: cypress-io/github-action@948d67d3074f1bbb6379c8bdbb04e95d2f8e593f
        with:
          working-directory: apps/admin/web
          install: false
          config-file: cypress.config.mjs
          spec: cypress/e2e/admin-auth.cy.js

  app-e2e:
    name: App Playwright E2E
    # Pinned: `ubuntu-latest` moved to 26.04, which the browsers these tests
    # drive do not support yet (Playwright refuses to install Chromium there).
    # Move back to `ubuntu-latest` together with the Playwright/Cypress upgrade.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run app Playwright smoke tests
        run: npx playwright test --config=playwright.config.ts

  build:
    name: Build All
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build all workspaces
        run: npm run build
