name: ColoringCore CI

on:
  pull_request:
    paths:
      - "engines/coloring/**"
      - ".github/workflows/coloring-core.yml"
  push:
    branches:
      - development
    paths:
      - "engines/coloring/**"
      - ".github/workflows/coloring-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coloring-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-test:
    name: JVM tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Test ColoringCore
        working-directory: engines/coloring
        run: gradle --no-daemon :coloring-core:jvmTest
