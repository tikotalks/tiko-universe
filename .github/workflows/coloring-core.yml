name: ColoringCore CI

on:
  pull_request:
    paths:
      - "engines/coloring/**"
      - ".github/workflows/coloring-core.yml"
  push:
    branches:
      - development
      - main
    paths:
      - "engines/coloring/**"
      - ".github/workflows/coloring-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coloring-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-test:
    name: JVM tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Test ColoringCore
        working-directory: engines/coloring
        run: gradle --no-daemon :coloring-core:jvmTest
