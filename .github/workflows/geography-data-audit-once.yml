                  ('loggerhead-sea-turtle','Loggerhead sea turtle','Caretta caretta','species',None,4,'marine'),
                  ('blue-rock-thrush','Blue rock-thrush','Monticola solitarius','species',None,3,'native'),
                  ('greater-flamingo','Greater flamingo','Phoenicopterus roseus','species','flamingo',7,'migrant'),
                  ('sicilian-shrew','Sicilian shrew','Crocidura sicula','species',None,8,'native'),
                  ('bat','Bat','Chiroptera','order',None,8,'native'),
              ],
          }

          # Replace Atlantic clownfish with genuinely Caribbean reef fauna when artwork exists.
          for cc in ATLANTIC_CLOWNFISH_FALSE:
              ADD.setdefault(cc, []).append(('royal-gramma','Royal gramma','Gramma loreto','species','royal-gramma',4,'marine'))

          # Replace Pacific template gulls with a characteristic seabird concept. Artwork can follow later.
          for cc in PACIFIC_TEMPLATE_GULLS:
              ADD.setdefault(cc, []).append(('white-tern','White tern','Gygis alba','species',None,4,'native'))

          # Media fallback is explicit and taxonomically safe enough for generic educational artwork.
          MEDIA_FALLBACK = {
              'north-african-hedgehog': 'hedgehog',
              'mediterranean-chameleon': 'chameleon',
              'european-rabbit': 'rabbit',
              'western-whip-snake': 'snake',
              'painted-frog': 'frog',
              'maltese-freshwater-crab': 'crab',
              'yellow-legged-gull': 'seagull',
              'laughing-gull': 'seagull',
              'magellanic-penguin': 'penguin',
              'little-penguin': 'penguin',
              'african-penguin': 'penguin',
              'gentoo-penguin': 'penguin',
              'galapagos-giant-tortoise': 'tortoise',
              'radiated-tortoise': 'tortoise',
              'aldabra-giant-tortoise': 'tortoise',
              'american-beaver': 'beaver',
              'wild-forest-reindeer': 'reindeer',
              'wild-reindeer': 'reindeer',
              'mongoose-lemur': 'lemur',
              'green-peafowl': 'peafowl',
              'indian-peafowl': 'peafowl',
              'greater-flamingo': 'flamingo',
              'american-flamingo': 'flamingo',
              'chilean-flamingo': 'flamingo',
              'irish-hare': None,
          }

          LOW_DETAIL = {
              'termite': 8, 'scorpion': 7, 'praying-mantis': 8, 'crab': 6,
              'hermit-crab': 6, 'sea-star': 7, 'gull': 6, 'laughing-gull': 6,
              'yellow-legged-gull': 5, 'frog': 6, 'snake': 6,
          }
          ICONIC = {
              ('AUS','kangaroo'), ('AUS','koala'), ('CHN','giant-panda'), ('IND','tiger'),
              ('KEN','lion'), ('TZA','lion'), ('BWA','african-savanna-elephant'), ('NAM','giraffe'),
              ('ZAF','lion'), ('RWA','gorilla'), ('UGA','gorilla'), ('COD','okapi'),
              ('ECU','galapagos-giant-tortoise'), ('NZL','kiwi'), ('MLT','maltese-wall-lizard'),
              ('CYP','cyprus-mouflon'), ('CYN','cyprus-mouflon'), ('JPN','japanese-macaque'),
              ('TWN','formosan-black-bear'), ('MNG','wild-bactrian-camel'), ('PHL','philippine-eagle'),
              ('GRL','polar-bear'), ('CAN','moose'), ('USA','american-bison'), ('MDG','lemur'),
              ('SYC','aldabra-giant-tortoise'), ('BTN','snow-leopard'), ('NPL','snow-leopard'),
          }

          # Some old titles correspond to media files under a slightly different slug.
          MEDIA_ALIASES = {
              'African Elephant': 'african-elephant', 'Asian Elephant': 'asian-elephant',
              'Red Fox': 'red-fox', 'Fox': 'fox', 'Brown Bear': 'brown-bear',
              'Eurasian Lynx': 'eurasian-lynx', 'Wild Boar': 'wild-boar', 'Red Deer': 'red-deer',
              'European Badger': 'european-badger', 'European Hare': 'european-hare',
              'Common Hedgehog': 'common-hedgehog', 'Golden Eagle': 'golden-eagle',
              'Bearded Vulture': 'bearded-vulture', 'Sea Turtle': None, 'Camel': None, 'Llama': None,
              'Giant Panda': None, 'Bald Eagle': None, 'Weasel': None, 'Maltese Wall Lizard': None,
          }

          def media_for(old_name, taxon_id, explicit=None):
              if explicit is not None:
                  return explicit if explicit in image_ids else None
              if taxon_id in MEDIA_FALLBACK:
                  candidate = MEDIA_FALLBACK[taxon_id]
                  return candidate if candidate and candidate in image_ids else None
              candidate = MEDIA_ALIASES.get(old_name, slug(old_name))
              return candidate if candidate and candidate in image_ids else None

          def importance_for(country_id, taxon_id, old_index, explicit=None):
              if explicit is not None:
                  return int(explicit)
              if (country_id, taxon_id) in ICONIC:
                  return 1
              base = min(7, 2 + old_index)
              return max(base, LOW_DETAIL.get(taxon_id, 1))

          def taxon_for(country_id, old_name):
              raw = SPECIFIC.get((country_id, old_name)) or TAXA.get(old_name)
              if raw:
                  return raw
              return (slug(old_name), old_name, None, 'concept')

          # GBIF gives us a real representative occurrence instead of a generated scatter point.
          taxon_key_cache = {}
          def gbif_taxon_key(scientific):
              if not scientific:
                  return None
              if scientific in taxon_key_cache:
                  return taxon_key_cache[scientific]
              q = urllib.parse.urlencode({'name': scientific})
              data = req_json('https://api.gbif.org/v1/species/match?' + q)
              key = data.get('usageKey') if isinstance(data, dict) else None
              taxon_key_cache[scientific] = key
              return key

          def distance_sq(a, b):
              return (a[0]-b[0])**2 + (a[1]-b[1])**2

          def gbif_location(scientific, iso2, old_point=None):
              if not scientific or not iso2 or len(str(iso2)) != 2:
                  return None
              key = gbif_taxon_key(scientific)
              if not key:
                  return None
              params = urllib.parse.urlencode({
                  'taxon_key': key,
                  'country': iso2,
                  'has_coordinate': 'true',
                  'occurrence_status': 'PRESENT',
                  'year': '2000,2026',
                  'limit': 100,
              })
              data = req_json('https://api.gbif.org/v1/occurrence/search?' + params)
              if not isinstance(data, dict):
                  return None
              pts = []
              for r in data.get('results', []):
                  lat = r.get('decimalLatitude')
                  lon = r.get('decimalLongitude')
                  if lat is None or lon is None:
                      continue
                  if not (-90 <= float(lat) <= 90 and -180 <= float(lon) <= 180):
                      continue
                  if r.get('basisOfRecord') == 'FOSSIL_SPECIMEN':
                      continue
                  pts.append((float(lat), float(lon), r.get('key')))
              if not pts:
                  return None
              # Choose an actual record nearest the median of the recent observations. This is deterministic,
              # representative, and avoids pretending the old country-centre scatter point was a habitat location.
              med = (statistics.median(p[0] for p in pts), statistics.median(p[1] for p in pts))
              chosen = min(pts, key=lambda p: distance_sq((p[0], p[1]), med))
              return {'lat': rounded(chosen[0]), 'lon': rounded(chosen[1]), 'source': 'gbif', 'occurrenceKey': chosen[2]}

          # Manual representative localities for highly sensitive/poorly covered taxa or concepts where an API hit is
          # not a good educational marker. These are representative habitat/locality points, not claimed sightings.
          MANUAL_POINTS = {
              ('MLT','mediterranean-chameleon'): (35.879, 14.389),
              ('MLT','north-african-hedgehog'): (35.902, 14.423),
              ('MLT','european-rabbit'): (35.855, 14.381),
              ('MLT','maltese-wall-lizard'): (35.816, 14.515),
              ('MLT','moorish-gecko'): (35.884, 14.398),
              ('MLT','painted-frog'): (35.858, 14.401),
              ('MLT','western-whip-snake'): (35.914, 14.355),
              ('MLT','maltese-freshwater-crab'): (35.895, 14.359),
              ('MLT','yellow-legged-gull'): (35.948, 14.425),
              ('MLT','common-bottlenose-dolphin'): (35.866, 14.190),
              ('MLT','loggerhead-sea-turtle'): (35.827, 14.160),
              ('MLT','blue-rock-thrush'): (35.829, 14.447),
              ('MLT','greater-flamingo'): (35.956, 14.427),
              ('CYP','cyprus-mouflon'): (34.930, 32.700),
              ('CYN','cyprus-mouflon'): (35.299, 33.002),
              ('ECU','galapagos-giant-tortoise'): (-0.640, -90.350),
              ('MNG','wild-bactrian-camel'): (43.600, 97.000),
              ('NZL','kiwi'): (-39.280, 175.570),
              ('NZL','tuatara'): (-41.200, 174.870),
              ('NCL','kagu'): (-21.610, 165.770),
              ('VNM','saola'): (17.950, 105.980),
              ('AUS','southern-cassowary'): (-16.170, 145.420),
              ('AUS','platypus'): (-37.580, 145.300),
          }

          # Build candidate occurrences first so GBIF calls can run concurrently.
          candidates = []
          country_names = {}
          existing_wanted = {}
          for country_id, country in old_animals.get('countries', {}).items():
              country_name = country.get('country') or country_id
              country_names[country_id] = country_name
              existing_wanted[country_id] = country.get('alsoWanted', [])
              for idx, old in enumerate(country.get('animals', [])):
                  old_name = old.get('name')
                  if not old_name or old_name in GLOBAL_REMOVE or old_name in REMOVE.get(country_id, set()):
                      continue
                  taxon_id, display, scientific, rank = taxon_for(country_id, old_name)
                  old_at = old.get('at') or {}
                  candidates.append({
                      'countryId': country_id,
                      'countryName': country_name,
                      'oldName': old_name,
                      'oldIndex': idx,
                      'id': taxon_id,
                      'display': display,
                      'scientific': scientific,
                      'rank': rank,
                      'note': old.get('note'),
                      'oldPoint': (old_at.get('lat'), old_at.get('lon')) if old_at.get('lat') is not None and old_at.get('lon') is not None else None,
                      'mediaId': media_for(old_name, taxon_id),
                      'importance': importance_for(country_id, taxon_id, idx),
                      'status': 'naturalised' if (country_id, taxon_id) in {('MLT','mediterranean-chameleon'),('MLT','european-rabbit'),('ISL','reindeer'),('COM','mongoose-lemur')} else 'wild',
                  })

          # Additions are first-class animal truth, not "media wishes".
          for country_id, additions in ADD.items():
              for pos, (taxon_id, display, scientific, rank, explicit_media, imp, status) in enumerate(additions):
                  candidates.append({
                      'countryId': country_id,
                      'countryName': country_names.get(country_id, country_id),
                      'oldName': None,
                      'oldIndex': 50 + pos,
                      'id': taxon_id,
                      'display': display,
                      'scientific': scientific,
                      'rank': rank,
                      'note': None,
                      'oldPoint': None,
                      'mediaId': media_for('', taxon_id, explicit_media) if explicit_media else media_for('', taxon_id),
                      'importance': imp,
                      'status': status,
                  })

          # Fold the previous alsoWanted list into the real animal dataset. Missing media is metadata, not a separate truth list.
          wanted_taxa = {
              'Shrew': ('shrew','Shrew','Soricidae','family'),
              'Bat': ('bat','Bat','Chiroptera','order'),
              'Octopus': ('octopus','Octopus','Octopoda','order'),
              'Squid': ('squid','Squid','Teuthida','order'),
              'Blue Rock-Thrush': ('blue-rock-thrush','Blue rock-thrush','Monticola solitarius','species'),
              'Sparrow': ('sparrow','Sparrow','Passeridae','family'),
              'Moorhen': ('common-moorhen','Common moorhen','Gallinula chloropus','species'),
              'Swift': ('swift','Swift','Apodidae','family'),
              'Heron': ('heron','Heron','Ardeidae','family'),
              'Egret': ('egret','Egret','Ardeidae','family'),
              'Kingfisher': ('kingfisher','Kingfisher','Alcedinidae','family'),
              'Bee-eater': ('bee-eater','Bee-eater','Meropidae','family'),
              'Skink': ('ocellated-skink','Ocellated skink','Chalcides ocellatus','species'),
          }
          for country_id, wanted in existing_wanted.items():
              already = {(c['countryId'], c['id']) for c in candidates}
              for idx, old in enumerate(wanted):
                  old_name = old.get('name')
                  raw = wanted_taxa.get(old_name)
                  if not raw:
                      raw = (slug(old_name), old_name, None, 'concept')
                  taxon_id, display, scientific, rank = raw
                  if (country_id, taxon_id) in already:
                      continue
                  candidates.append({
                      'countryId': country_id,
                      'countryName': country_names.get(country_id, country_id),
                      'oldName': old_name,
                      'oldIndex': 70 + idx,
                      'id': taxon_id,
                      'display': display,
                      'scientific': scientific,
                      'rank': rank,
                      'note': None,
                      'oldPoint': None,
                      'mediaId': media_for(old_name, taxon_id),
                      'importance': min(10, 7 + idx // 4),
                      'status': 'wild',
                  })

          # Deduplicate country + taxon, keeping the best importance and the more specific/manual candidate.
          dedup = {}
          for c in candidates:
              key = (c['countryId'], c['id'])
              if key not in dedup or c['importance'] < dedup[key]['importance']:
                  dedup[key] = c
          candidates = list(dedup.values())

          def locate(c):
              manual = MANUAL_POINTS.get((c['countryId'], c['id']))
              if manual:
                  return {'lat': rounded(manual[0]), 'lon': rounded(manual[1]), 'source': 'curated-locality'}
              iso2 = iso2_by_id.get(c['countryId'])
              found = gbif_location(c['scientific'], iso2, c['oldPoint'])
              if found:
                  return found
              if c['oldPoint'] and c['oldPoint'][0] is not None and c['oldPoint'][1] is not None:
                  return {'lat': rounded(c['oldPoint'][0]), 'lon': rounded(c['oldPoint'][1]), 'source': 'legacy-authored-needs-review'}
              return None

          locations = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              future_map = {pool.submit(locate, c): (c['countryId'], c['id']) for c in candidates}
              for future in concurrent.futures.as_completed(future_map):
                  key = future_map[future]
                  try:
                      locations[key] = future.result()
                  except Exception:
                      locations[key] = None

          # Build new country animal schema directly. No old name identity, no at wrapper, no alsoWanted split.
          new_country_animals = {
              'schemaVersion': 2,
              'contract': {
                  'identity': 'animals[].id is stable; mediaId is optional presentation artwork and never identity',
                  'translation': 'names is locale keyed; geography.animals.<id> is the translation key if a locale is absent here',
                  'location': 'lat/lon is an authored or real-observation representative marker; it is not generated scatter',
                  'importance': '1 is most important / visible furthest out; 10 is detail-only',
                  'wildlife': 'Only wild, naturalised, migrant or marine wildlife belongs here. Domestic display animals are excluded.'
              },
              'reviewStates': ['draft', 'reviewed', 'verified'],
              'countries': {}
          }

          by_country = {}
          for c in candidates:
              by_country.setdefault(c['countryId'], []).append(c)

          # Make sure every country survives even if all old template animals were removed.
          for country_id, old_country in old_animals.get('countries', {}).items():
              animals_out = []
              seen = set()
              for c in sorted(by_country.get(country_id, []), key=lambda x: (x['importance'], x['id'])):
                  if c['id'] in seen:
                      continue
                  seen.add(c['id'])
                  loc = locations.get((country_id, c['id']))
                  if not loc:
                      # A missing coordinate is retained as unresolved data only if the animal is significant enough;
                      # it gets no marker until a real locality is authored.
                      if c['importance'] > 5:
                          continue
                  item = {
                      'id': c['id'],
                      'names': {'en': c['display']},
                      'i18nKey': f"geography.animals.{c['id']}",
                      'scientificName': c['scientific'],
                      'taxonRank': c['rank'],
                      'status': c['status'],
                      'importance': int(c['importance']),
                      'mediaId': c['mediaId'],
                  }
                  if loc:
                      item['lat'] = loc['lat']
                      item['lon'] = loc['lon']
                      item['locationSource'] = {k: v for k, v in loc.items() if k not in {'lat','lon'} and v is not None}
                  if c['note']:
                      item['note'] = c['note']
                  animals_out.append(item)

              # A country must have usable educational wildlife. If strict corrections removed everything,
              # preserve the best unresolved candidates rather than inventing a replacement species.
              if not animals_out:
                  unresolved = sorted(by_country.get(country_id, []), key=lambda x: (x['importance'], x['id']))[:3]
                  for c in unresolved:
                      animals_out.append({
                          'id': c['id'], 'names': {'en': c['display']}, 'i18nKey': f"geography.animals.{c['id']}",
                          'scientificName': c['scientific'], 'taxonRank': c['rank'], 'status': c['status'],
                          'importance': int(c['importance']), 'mediaId': c['mediaId'], 'locationPending': True,
                      })

              all_real_coords = bool(animals_out) and all('lat' in a and a.get('locationSource', {}).get('source') != 'legacy-authored-needs-review' for a in animals_out)
              previous_review = old_country.get('review', {})
              state = 'reviewed' if all_real_coords else 'draft'
              # Sil's Malta verification is preserved only as provenance; the changed data is marked reviewed, not falsely re-verified.
              review = {
                  'state': state,
                  'by': 'openai-geography-audit',
                  'at': TODAY,
                  'previous': previous_review if previous_review.get('state') == 'verified' else None,
              }
              if review['previous'] is None:
                  review.pop('previous')
              new_country_animals['countries'][country_id] = {
                  'countryId': country_id,
                  'names': {'en': old_country.get('country') or country_id},
                  'review': review,
                  'animals': animals_out,
              }

          # ------------------------------------------------------------------
          # Landmarks: preserve the already-authored coordinates/importance, but make identity/media/localization explicit.
          # The old source was substantially better than the animal seeding and is not randomly repositioned.
          # ------------------------------------------------------------------
          new_landmarks = {
              'schemaVersion': 2,
              'contract': {
                  'identity': 'landmarks[].id is stable; names is locale keyed',
                  'translation': 'geography.landmarks.<id> is the translation key if a locale is absent here',
                  'location': 'lat/lon is the landmark itself or the representative point for a natural/site landmark',
                  'importance': '1 is most important / visible furthest out; 10 is detail-only',
              },
              'reviewStates': ['draft', 'reviewed', 'verified'],
              'countries': {}
          }
          landmark_id_counts = {}
          for country_id, country in old_landmarks.get('countries', {}).items():
              out = []
              used = set()
              for lm in country.get('landmarks', []):
                  name = lm.get('name')
                  if not name:
                      continue
                  base_id = slug(name)
                  lm_id = base_id
                  n = 2
                  while lm_id in used:
                      lm_id = f'{base_id}-{n}'
                      n += 1
                  used.add(lm_id)
                  media_id = slug(name)
                  if media_id not in image_ids:
                      media_id = None
                  lat = rounded(lm.get('lat'))
                  lon = rounded(lm.get('lon'))
                  imp = max(1, min(10, int(lm.get('importance', 6))))
                  item = {
                      'id': lm_id,
                      'names': {'en': name},
                      'i18nKey': f'geography.landmarks.{lm_id}',
                      'lat': lat,
                      'lon': lon,
                      'importance': imp,
                      'glyph': lm.get('glyph') or '📍',
                      'mediaId': media_id,
                  }
                  if lm.get('note'):
                      item['note'] = lm['note']
                  out.append(item)
              new_landmarks['countries'][country_id] = {
                  'countryId': country_id,
                  'names': {'en': country.get('country') or country_names.get(country_id, country_id)},
                  'review': country.get('review') or {'state': 'draft', 'by': None, 'at': None},
                  'landmarks': sorted(out, key=lambda x: (x['importance'], x['id']))
              }

          # ------------------------------------------------------------------
          # Districts: explicit surface + localized name contract. Add narrower ranges for known bad broad mappings.
          # ------------------------------------------------------------------
          new_district_items = []
          existing_ids = set()
          for d in old_districts.get('items', []):
              did = d.get('id')
              if not did:
                  continue
              existing_ids.add(did)
              new_district_items.append({
                  'id': did,
                  'names': {'en': d.get('name') or did},
                  'i18nKey': f'geography.districts.{did}',
                  'points': [{'lat': rounded(p['lat']), 'lon': rounded(p['lon'])} for p in d.get('points', [])],
                  'spreadDegrees': float(d.get('spreadDegrees', 0)),
                  'surface': 'water' if d.get('isMarine') else 'land',
                  'generic': bool(d.get('isGeneric')),
              })
          EXTRA_DISTRICTS = [
              ('north-america-southeast-wetlands','Wetlands of the southeastern United States',[(25.6,-80.7),(30.1,-91.2)],3,'land'),
              ('australia-north','Tropical northern Australia',[(-16.2,145.4),(-13.1,131.0)],4,'land'),
              ('new-guinea','New Guinea',[(-5.5,145.0),(-7.0,141.0)],5,'land'),
              ('borneo-sumatra','Borneo and Sumatra',[(0.8,114.0),(0.2,101.7)],6,'land'),
              ('philippines-forest','Forests of the Philippines',[(9.8,124.2),(7.2,125.3)],4,'land'),
          ]
          for did, name, pts, spread, surface in EXTRA_DISTRICTS:
              if did not in existing_ids:
                  new_district_items.append({
                      'id': did, 'names': {'en': name}, 'i18nKey': f'geography.districts.{did}',
                      'points': [{'lat': lat, 'lon': lon} for lat, lon in pts], 'spreadDegrees': spread,
                      'surface': surface, 'generic': False,
                  })
          new_districts = {
              'schemaVersion': 2,
              'contract': {
                  'purpose': 'Broad habitat/region context only; country occurrence truth lives in country-animals.json',
                  'surface': 'land or water',
              },
              'items': new_district_items,
          }

          # ------------------------------------------------------------------
          # Animal districts: stable item records instead of media-title object keys. Known false broad ranges corrected.
          # ------------------------------------------------------------------
          new_ad_items = []
          overrides = {
              'alligator': (['north-america-southeast-wetlands'], [(25.6,-80.7),(30.1,-91.2)]),
              'cassowary': (['australia-north','new-guinea'], [(-16.2,145.4),(-5.5,145.0)]),
              'orangutan': (['borneo-sumatra'], [(1.0,114.0),(0.5,101.8)]),
              'tarsier': (['borneo-sumatra','philippines-forest'], [(1.2,120.4),(9.8,124.2),(4.1,114.8)]),
          }
          for old_key, entry in old_animal_districts.get('animals', {}).items():
              display_old = old_key.replace('-', ' ').title()
              # Prefer taxonomy from a media title match ignoring case.
              match_name = next((k for k in TAXA if k.lower() == old_key.lower()), None)
              raw = TAXA.get(match_name) if match_name else None
              taxon_id = raw[0] if raw else slug(old_key)
              display = raw[1] if raw else display_old
              scientific = raw[2] if raw else None
              rank = raw[3] if raw else 'concept'
              districts_for = list(entry.get('districts', []))
              markers = []
              for p in entry.get('at', []):
                  if p.get('lat') is not None and p.get('lon') is not None:
                      markers.append({'lat': rounded(p['lat']), 'lon': rounded(p['lon']), 'districtId': p.get('district')})
              if taxon_id in overrides:
                  districts_for, pts = overrides[taxon_id]
                  markers = [{'lat': lat, 'lon': lon, 'districtId': districts_for[min(i, len(districts_for)-1)]} for i, (lat, lon) in enumerate(pts)]
              media_id = slug(old_key)
              if media_id not in image_ids:
                  media_id = None
              new_ad_items.append({
                  'id': taxon_id,
                  'names': {'en': display},
                  'i18nKey': f'geography.animals.{taxon_id}',
                  'scientificName': scientific,
                  'taxonRank': rank,
                  'mediaId': media_id,
                  'districtIds': districts_for,
                  'markers': markers,
                  'importance': max(1, min(10, int(entry.get('importance', 6)))),
              })
          new_animal_districts = {
              'schemaVersion': 2,
              'contract': {
                  'purpose': 'World-scale broad ranges and representative markers; never infer country membership from this file',
                  'identity': 'items[].id is stable and independent of mediaId',
                  'importance': '1 is most important / visible furthest out; 10 is detail-only',
              },
              'items': sorted(new_ad_items, key=lambda x: x['id'])
          }

          # Validation before writing. It is intentionally independent of the old builder contract.
          assert set(new_country_animals['countries']) == set(old_animals.get('countries', {})), 'country animal coverage changed'
          assert set(new_landmarks['countries']) == set(old_landmarks.get('countries', {})), 'landmark country coverage changed'
          for cc, c in new_country_animals['countries'].items():
              assert c['animals'], f'{cc} has no animals'
              ids = [a['id'] for a in c['animals']]
              assert len(ids) == len(set(ids)), f'{cc} duplicate animal id'
              for a in c['animals']:
                  assert 1 <= a['importance'] <= 10
                  assert a['names'].get('en')
                  if 'lat' in a:
                      assert -90 <= a['lat'] <= 90 and -180 <= a['lon'] <= 180
          for cc, c in new_landmarks['countries'].items():
              assert c['landmarks'], f'{cc} has no landmarks'
              ids = [x['id'] for x in c['landmarks']]
              assert len(ids) == len(set(ids)), f'{cc} duplicate landmark id'
              for lm in c['landmarks']:
                  assert 1 <= lm['importance'] <= 10
                  assert -90 <= lm['lat'] <= 90 and -180 <= lm['lon'] <= 180
                  assert lm['names'].get('en')

          save(COUNTRY_ANIMALS, new_country_animals)
          save(COUNTRY_LANDMARKS, new_landmarks)
          save(ANIMAL_DISTRICTS, new_animal_districts)
          save(DISTRICTS, new_districts)
          PY

      - name: Ensure generated artifacts were not touched
        shell: bash
        run: |
          git diff --exit-code -- packages/geography/generated packages/geography/content/animals.json packages/geography/content/landmarks.json

      - name: Commit authored data and remove this one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/geography-data-audit-once.yml
          git config user.name "Tiko Geography Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -- packages/geography/content/country-animals.json packages/geography/content/country-landmarks.json packages/geography/content/animal-districts.json packages/geography/content/districts.json .github/workflows/geography-data-audit-once.yml
          git commit -m "data(geography): audit country animals and normalize landmark contracts"
          git push origin HEAD:feat/tiko-globe-app
