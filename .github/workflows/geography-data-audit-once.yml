name: Geography authored data audit (one-shot)

on:
  push:
    branches:
      - feat/tiko-globe-app
    paths:
      - .github/workflows/geography-data-audit-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tiko-globe-app
          fetch-depth: 0

