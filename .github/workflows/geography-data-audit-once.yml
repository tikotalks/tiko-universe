          ROOT = Path('packages/geography/content')
          COUNTRY_ANIMALS = ROOT / 'country-animals.json'
          COUNTRY_LANDMARKS = ROOT / 'country-landmarks.json'
          ANIMAL_DISTRICTS = ROOT / 'animal-districts.json'
          DISTRICTS = ROOT / 'districts.json'
          GENERATED_COUNTRIES = Path('packages/geography/generated/countries.json')
          IMAGE_DIR = ROOT / 'images'

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def save(path, data):
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def slug(value):
              value = unicodedata.normalize('NFKD', str(value)).encode('ascii', 'ignore').decode('ascii').lower()
              value = value.replace('&', ' and ')
              value = re.sub(r'[^a-z0-9]+', '-', value).strip('-')
              return value or ('item-' + hashlib.sha1(str(value).encode()).hexdigest()[:8])

          def rounded(v):
              return round(float(v), 3)

          def req_json(url, timeout=12, retries=2):
              for attempt in range(retries + 1):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'TikoGlobeGeographyAudit/1.0 (github.com/tikotalks/tiko-universe)'})
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          return json.loads(response.read().decode('utf-8'))
                  except Exception:
                      if attempt == retries:
                          return None
                      time.sleep(0.35 * (attempt + 1))
              return None

          old_animals = load(COUNTRY_ANIMALS)
          old_landmarks = load(COUNTRY_LANDMARKS)
          old_animal_districts = load(ANIMAL_DISTRICTS)
          old_districts = load(DISTRICTS)
          generated = load(GENERATED_COUNTRIES)
          image_ids = {p.stem for p in IMAGE_DIR.glob('*.png')}

