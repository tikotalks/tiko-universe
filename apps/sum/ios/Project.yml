name: TikoSum
options:
  bundleIdPrefix: mt.tiko
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
packages:
  TikoKit:
    path: ../../../packages/tikokit-ios
targets:
  TikoSum:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: TikoKit
        product: TikoKit
      - package: TikoKit
        product: TikoSpeechKit
    preBuildScripts:
      - name: Generate Tiko app config
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          REPO_ROOT="${SRCROOT}/../../.."
          if ! command -v node >/dev/null 2>&1; then
            echo "error: node is required to generate Tiko app configs from admin before iOS build."
            exit 1
          fi
          TIKO_APP_CONFIG_STRICT=1 node "${REPO_ROOT}/tools/generate-app-configs.mjs"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mt.tiko.sum
        INFOPLIST_FILE: Sources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Sources/TikoSum.entitlements
  TikoSumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: TikoSum
      - package: TikoKit
        product: TikoKit
      - package: TikoKit
        product: TikoSpeechKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TikoSumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: TikoSum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TikoSum
schemes:
  TikoSum:
    build:
      targets:
        TikoSum: all
    test:
      targets:
        - TikoSumTests
        - TikoSumUITests
      gatherCoverageData: false
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
