name: TikoType
options:
  bundleIdPrefix: mt.tiko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 38MGF83L2L
packages:
  TikoKit:
    path: ../../../packages/tikokit-ios
targets:
  TikoType:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: TikoKit
    preBuildScripts:
      - name: Generate Tiko app config
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          REPO_ROOT="${SRCROOT}/../../.."
          if ! command -v node >/dev/null 2>&1; then
            echo "error: node is required to generate Tiko app configs from admin before iOS build."
            exit 1
          fi
          TIKO_APP_CONFIG_STRICT=1 node "${REPO_ROOT}/tools/generate-app-configs.mjs"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mt.tiko.type
        INFOPLIST_FILE: Sources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_ENTITLEMENTS: Sources/TikoType.entitlements
  TikoTypeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: TikoType
      - package: TikoKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TikoTypeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: TikoType
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TikoType
schemes:
  TikoType:
    build:
      targets:
        TikoType: all
    test:
      targets:
        - TikoTypeTests
        - TikoTypeUITests
      gatherCoverageData: false
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
