name: TikoCards
options:
  bundleIdPrefix: mt.tiko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # The Apple Developer team the apps are signed with. It used to be empty, which
    # meant a device build could not be signed at all until someone set the team in
    # Xcode by hand — and xcodegen then overwrote that on the next generate, so the
    # next device build failed the same way. A build machine that signs as somebody
    # else overrides it on the command line, where it takes precedence.
    DEVELOPMENT_TEAM: 38MGF83L2L
packages:
  TikoKit:
    path: ../../../packages/tikokit-ios
targets:
  TikoCards:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: TikoKit
    preBuildScripts:
      - name: Generate Tiko app config
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          REPO_ROOT="${SRCROOT}/../../.."
          if ! command -v node >/dev/null 2>&1; then
            echo "error: node is required to generate Tiko app configs from admin before iOS build."
            exit 1
          fi
          TIKO_APP_CONFIG_STRICT=1 node "${REPO_ROOT}/tools/generate-app-configs.mjs"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mt.tiko.cards
        INFOPLIST_FILE: Sources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_ENTITLEMENTS: Sources/TikoCards.entitlements
  TikoCardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: TikoCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TikoCardsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: TikoCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TikoCards
schemes:
  TikoCards:
    build:
      targets:
        TikoCards: all
    test:
      targets:
        - TikoCardsTests
        - TikoCardsUITests
      gatherCoverageData: false
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
